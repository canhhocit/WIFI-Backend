server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:250}
      min-spare: ${TOMCAT_MIN_SPARE:25}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:1000}
    connection-timeout: 10000
    keep-alive-timeout: 30000
    max-keep-alive-requests: 1000
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

spring:
  application:
    name: wifi-captive-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      host: ${REDIS_HOST:immense-fish-280872.upstash.io}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:gQAAAAAABEkoAAIgcDJmMTBkYmIyN2NlYTM0NDcyODE3ZTcxYTM0Mjc1OGE5Mg}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      timeout: 5000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-service.default.svc.cluster.local:5432/wifi_haiphong}
    username: ${POSTGRES_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${POSTGRES_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Dnt@#$123!}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:25}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 30000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      "[hibernate.format_sql]": false
      "[hibernate.jdbc.time_zone]": UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:admin123}
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@captive.local}
      full-name: System Administrator

  gateway:
    adapter-type: ${GATEWAY_ADAPTER_TYPE:gwn_cloud}
    simulate-failures: ${GATEWAY_SIMULATE_FAILURES:false}
    simulate-latency-ms: ${GATEWAY_SIMULATE_LATENCY_MS:0}
    gwn-cloud:
      base-url: ${GWN_CLOUD_BASE_URL:https://oc.gwn.cloud}
      app-id: ${GWN_CLOUD_APP_ID:}
      app-secret: ${GWN_CLOUD_APP_SECRET:}
      network-id: ${GWN_CLOUD_NETWORK_ID:}
      device-mac: ${GWN_CLOUD_DEVICE_MAC:EC74D798B042}

  # Giám sát trực tiếp mesh AP Viettel HomeWiFi (vAP-32X6V1) qua API ubus của thiết bị.
  # Chỉ bật trên máy chủ có đường mạng tới LAN điểm phát (chạy tại chỗ hoặc qua VPN từ gateway).
  mesh-ap:
    enabled: ${MESH_AP_ENABLED:false}
    username: ${MESH_AP_USERNAME:admin}
    # Lần đầu hệ thống đăng nhập bằng S/N của từng thiết bị (mật khẩu gốc firmware V1.6.6_VN, nạp qua import
    # danh sách bàn giao), sau đó tự đổi sang mật khẩu quản lý chung này. Để trống = giữ nguyên S/N.
    # Đặt qua secret, KHÔNG ghi vào git.
    managed-password: ${MESH_AP_MANAGED_PASSWORD:}
    rotate-factory-password: ${MESH_AP_ROTATE_FACTORY_PASSWORD:true}
    poll-interval-ms: ${MESH_AP_POLL_INTERVAL_MS:60000}
    # Agent tại điểm phát đẩy dữ liệu lên /api/v1/agent/mesh/** (khi máy chủ không vào được LAN). Chỉ lưu
    # SHA-256 của token agent, không lưu token gốc. Để trống = tắt.
    agent-token-sha256: ${MESH_AGENT_TOKEN_SHA256:}
    agent-stale-after-ms: ${MESH_AGENT_STALE_AFTER_MS:300000}
    # Khi agent self-push gửi lên một mesh chưa có trong CSDL: tự tạo bản ghi AP từ dữ liệu thiết bị
    # tự báo (MAC/S-N/model), thay cho khai báo tay từng điểm. Giúp triển khai 1500 điểm không cần
    # seed cứng và không cần phần cứng thu thập riêng. Đặt false nếu chỉ muốn nhận AP đã khai báo sẵn.
    agent-auto-provision: ${MESH_AGENT_AUTO_PROVISION:true}
    timeout-ms: ${MESH_AP_TIMEOUT_MS:5000}
    radius:
      enabled: ${RADIUS_ENABLED:true}
      port: ${RADIUS_PORT:1812}
      acct-port: ${RADIUS_ACCT_PORT:1813}
      shared-secret: ${RADIUS_SHARED_SECRET:HaiPhongSecret@2026}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

  upstash:
    redis:
      rest-url: ${UPSTASH_REDIS_REST_URL:https://immense-fish-280872.upstash.io}
      rest-token: ${UPSTASH_REDIS_REST_TOKEN:gQAAAAAABEkoAAIgcDJmMTBkYmIyN2NlYTM0NDcyODE3ZTcxYTM0Mjc1OGE5Mg}

minio:
  enabled: ${MINIO_ENABLED:false}
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:wifi-haiphong}
  public-url: ${MINIO_PUBLIC_URL:https://minio.phuchoangmai.xyz/wifi-haiphong}

management:
  endpoints:
    web:
      exposure:
        include: health,info
