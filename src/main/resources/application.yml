server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: wifi-captive-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-little-credit-aon6wivs-pooler.c-2.ap-southeast-1.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${POSTGRES_USER:neondb_owner}
    password: ${POSTGRES_PASSWORD:npg_om9Kkzucr2wG}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:admin123}
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@captive.local}
      full-name: System Administrator

  gateway:
    adapter-type: ${GATEWAY_ADAPTER_TYPE:mock}
    simulate-failures: ${GATEWAY_SIMULATE_FAILURES:false}
    simulate-latency-ms: ${GATEWAY_SIMULATE_LATENCY_MS:100}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
