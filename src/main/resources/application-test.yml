spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:wifi_captive_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  gateway:
    simulate-latency-ms: 0
    simulate-failures: false
